[project]
name = "arubaio-mcp"
version = "0.1.0"
description = "Read-only MCP server for HPE Aruba Instant On"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.2.5,<5",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
